name: Generate final Kokoro audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: b2-144-155
            start: 344
            limit: 12
          - batch: b2-156-167
            start: 356
            limit: 12
          - batch: b2-178-189
            start: 378
            limit: 12
          - batch: b2-190-200
            start: 390
            limit: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audio.txt
      - run: pip install -r requirements-audio.txt
      - name: Download Kokoro model files
        shell: bash
        run: |
          mkdir -p .audio-cache
          curl -L -o .audio-cache/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L -o .audio-cache/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Generate batch
        run: python scripts/generate_audio.py --start ${{ matrix.start }} --limit ${{ matrix.limit }}
      - name: Collect batch files
        shell: bash
        env:
          START: ${{ matrix.start }}
          LIMIT: ${{ matrix.limit }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          lessons = json.loads(Path('src/data/lessons.json').read_text(encoding='utf-8'))
          start = int(os.environ['START']) - 1
          limit = int(os.environ['LIMIT'])
          out = Path('generated-audio')
          out.mkdir()
          for lesson in lessons[start:start + limit]:
              source = Path('public') / lesson['audio']['file']
              shutil.copy2(source, out / source.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.batch }}
          path: generated-audio/*.m4a
          if-no-files-found: error

  commit:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: public/audio
          merge-multiple: true
      - name: Commit generated audio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          git diff --cached --quiet && exit 0
          git commit -m "Add final Kokoro audio"
          git push
